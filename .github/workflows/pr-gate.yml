# Lane 1 — PR gate (deterministic, no live model calls).
# CI-1 lint · CI-2 contracts · ICD-3 schema immutability · CI-3 unit (seed) ·
# DFT-1 traceability · CI-7 secrets. Lane 2 (deploy) and Lane 3 (acceptance)
# land per FORGE-BUILD-PLAN.md Days 7 and 9.
name: pr-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: "CI-1 lint & format (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - run: ruff check .
      - run: ruff format --check .

  contracts:
    name: "CI-2 contract gate + ICD-3 schema versions"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - run: python scripts/validate_contracts.py
      - name: schema immutability vs base
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          python scripts/check_schema_versions.py "$BASE"

  unit:
    name: "CI-3 unit gate (stubbed models)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - run: pytest

  emulator:
    name: "ICD-5/6 integration gate (Firestore + Pub/Sub emulators)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "cloud-firestore-emulator,pubsub-emulator,beta"
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - name: run integration tests against emulators
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8080 \
            > /tmp/firestore-emulator.log 2>&1 &
          gcloud beta emulators pubsub start --project=demo-forge \
            --host-port=127.0.0.1:8085 > /tmp/pubsub-emulator.log 2>&1 &
          up=0
          for i in $(seq 1 120); do
            if nc -z 127.0.0.1 8080 && nc -z 127.0.0.1 8085; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != "1" ]; then
            echo "::error::emulators failed to open ports within 120s"
            echo "--- firestore emulator log ---"; cat /tmp/firestore-emulator.log
            echo "--- pubsub emulator log ---"; cat /tmp/pubsub-emulator.log
            exit 1
          fi
          FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 \
          PUBSUB_EMULATOR_HOST=127.0.0.1:8085 \
            pytest tests/emulator -q || {
              echo "--- firestore emulator log (tail) ---"; tail -50 /tmp/firestore-emulator.log
              echo "--- pubsub emulator log (tail) ---"; tail -50 /tmp/pubsub-emulator.log
              exit 1
            }

  traceability:
    name: "DFT-1 traceability gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock
      - run: python scripts/check_traceability.py

  secrets:
    name: "CI-7 secrets scan (fail closed)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
