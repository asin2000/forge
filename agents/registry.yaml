# Agent Registry — declarative definitions (REG-1, v1.2).
# Loaded into the Firestore `agent_registry` collection by the PLT-6 deploy step.
# Definition lifecycle: DRAFT | APPROVED | DEPRECATED | RETIRED.
# Runtime instances (IDLE | RESERVE | ACTIVE | FAILED) and derived health
# (HEALTHY | STALE | UNKNOWN) live in Firestore, never in this file (REG-1).
# `endpoint: null` until the Lane-2 worker deployment (Day 7) records the
# real Cloud Run URL; CI-9 rejects placeholder strings and requires a real
# URL once architecture/manifest.yaml marks the role deployed;
# `service_identity` is the per-role service account (AGT-6).
version: 1
agents:
  - agent_id: forge-orchestrator
    version: 0.1.0
    department_owner: Operations
    capabilities: [workflow-orchestration]
    lifecycle_status: APPROVED
    contracts:
      consumes: [nmc_event.v2, maintenance_action_plan.v2, sourcing_report.v3, validation_verdict.v2, approval_decision.v2, agent_failure_event.v2, due_event.v2]
      produces: [work_package_assignment.v2, approval_request.v2, audit_event.v2]
    service_identity: forge-orchestrator@PROJECT_ID.iam.gserviceaccount.com
    endpoint: https://forge-orchestrator-3vnecimj5a-uc.a.run.app
    permitted_tools: [firestore-workflow-state, pubsub-publish, logical-clock]
  - agent_id: forge-maintenance
    version: 0.1.0
    department_owner: Maintenance
    capabilities: [maintenance-planning]
    lifecycle_status: APPROVED
    contracts:
      consumes: [work_package_assignment.v2]
      produces: [maintenance_action_plan.v2, audit_event.v2]
    service_identity: forge-maintenance@PROJECT_ID.iam.gserviceaccount.com
    endpoint: https://forge-maintenance-3vnecimj5a-uc.a.run.app
    permitted_tools: [procedures-library-read, pubsub-publish]
  - agent_id: forge-supply
    version: 0.1.0
    department_owner: Supply
    capabilities: [parts-sourcing]
    lifecycle_status: APPROVED
    contracts:
      consumes: [work_package_assignment.v2]
      produces: [sourcing_report.v3, audit_event.v2]
    service_identity: forge-supply@PROJECT_ID.iam.gserviceaccount.com
    endpoint: https://forge-supply-3vnecimj5a-uc.a.run.app
    permitted_tools: [approved-parts-registry-read, pubsub-publish]
  - agent_id: forge-workforce
    version: 0.1.0
    department_owner: Workforce
    capabilities: [technician-assignment]
    lifecycle_status: APPROVED
    contracts:
      consumes: [work_package_assignment.v2]
      produces: [roster_assignment.v2, audit_event.v2]
    service_identity: forge-workforce@PROJECT_ID.iam.gserviceaccount.com
    endpoint: https://forge-workforce-3vnecimj5a-uc.a.run.app
    permitted_tools: [qualification-records-read, pubsub-publish]
  - agent_id: forge-safety
    version: 0.1.0
    department_owner: Safety & Policy
    capabilities: [action-validation]
    lifecycle_status: APPROVED
    contracts:
      consumes: [maintenance_action_plan.v2, quarantine_verdict.v3, roster_assignment.v2, sourcing_report.v3]
      produces: [validation_verdict.v2, audit_event.v2]
    service_identity: forge-safety@PROJECT_ID.iam.gserviceaccount.com
    endpoint: https://forge-safety-3vnecimj5a-uc.a.run.app
    permitted_tools: [procedures-library-read, approved-parts-registry-read, pubsub-publish]
  - agent_id: forge-cyber-trust
    version: 0.1.0
    department_owner: Cyber Trust
    capabilities: [document-screening]
    lifecycle_status: APPROVED
    contracts:
      consumes: []          # reads quarantine storage only; no bus consumption (SEC-4)
      produces: [quarantine_verdict.v3, audit_event.v2]
    service_identity: forge-cyber-trust@PROJECT_ID.iam.gserviceaccount.com
    endpoint: null
    permitted_tools: [quarantine-storage-read, model-armor-screen, pubsub-publish]
