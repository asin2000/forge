# Service manifest (DFT-5): each service -> source modules -> diagram node.
# CI-9 (scripts/check_config.py) validates this manifest against the
# registry, the DAT-1 residency map, and the services/ tree on every PR:
# statuses must match reality (code on disk may not claim "planned";
# "deployed" requires a real Cloud Run endpoint in the DAT-1 region),
# service accounts must be the resolved per-role ids from infra/deploy.sh,
# and the Cloud Logging location must match the residency map.
#
# status vocabulary:
#   planned      - no code yet
#   implemented  - code merged and emulator-verified; not deployed
#                  as a Cloud Run service
#   deployed     - live on Cloud Run; endpoint is the deployment record
version: 1
region: us-central1            # single pinned region (PLT-1)
model: gemini-3.5-flash        # all Orchestrator/specialist reasoning (PLT-1)
services:
  orchestrator:
    status: deployed
    cloud_run_service: forge-orchestrator
    service_account: forge-orchestrator
    endpoint: https://forge-orchestrator-3vnecimj5a-uc.a.run.app
    source: [services/orchestrator/, services/worker.py]
    diagram_node: orchestrator
    requirements: [ORC-1, ORC-2, ORC-3, ORC-4, ORC-5, HUM-2]
  maintenance:
    status: deployed
    cloud_run_service: forge-maintenance
    service_account: forge-maintenance
    endpoint: https://forge-maintenance-3vnecimj5a-uc.a.run.app
    source: [services/maintenance/, services/worker.py]
    diagram_node: maintenance
    requirements: [AGT-1]
  supply:
    status: deployed
    cloud_run_service: forge-supply
    service_account: forge-supply
    endpoint: https://forge-supply-3vnecimj5a-uc.a.run.app
    source: [services/supply/, services/worker.py]
    diagram_node: supply
    requirements: [AGT-2]
  workforce:
    status: deployed
    cloud_run_service: forge-workforce
    service_account: forge-workforce
    endpoint: https://forge-workforce-3vnecimj5a-uc.a.run.app
    source: [services/workforce/, services/worker.py]
    diagram_node: workforce
    requirements: [AGT-3]
  safety:
    status: deployed
    cloud_run_service: forge-safety
    service_account: forge-safety
    endpoint: https://forge-safety-3vnecimj5a-uc.a.run.app
    source: [services/safety/, services/worker.py]
    diagram_node: safety
    requirements: [AGT-4]
  cyber_trust:
    status: deployed
    cloud_run_service: forge-cyber-trust
    service_account: forge-cyber-trust
    endpoint: https://forge-cyber-trust-3vnecimj5a-uc.a.run.app
    source: [services/cyber_trust/, services/worker.py]
    diagram_node: cyber_trust
    requirements: [AGT-5, SEC-1, SEC-2, SEC-3, SEC-4]
  dashboard:
    status: deployed
    cloud_run_service: forge-dashboard
    service_account: forge-dashboard
    endpoint: https://forge-dashboard-3vnecimj5a-uc.a.run.app
    source: [services/dashboard/]
    diagram_node: dashboard
    requirements: [HUM-1, HUM-2, REG-4, AUD-2]
shared:
  contracts: {source: [contracts/], requirements: [ICD-1, ICD-2, ICD-3, ICD-4]}
  forge_common: {source: [src/forge_common/], requirements: [ICD-2]}
infrastructure:
  firestore: {purpose: "workflow state, inbox/outbox, audit, Logical Clock", requirements: [ORC-5, AUD-2, ICD-5]}
  pubsub: {purpose: "agent bus with per-workflow ordering keys + DLQ", requirements: [ICD-5]}
  model_armor: {purpose: "SEC screening", requirements: [PLT-4, SEC-1]}
observability:
  cloud_logging_location: us-central1   # DAT-1 map: cloud_logging
  # Cloud Trace receives metadata-only telemetry and is the disclosed
  # residency exception (DAT-3/OBS-2); wiring lands Day 7 (OBS-1/OBS-2).
